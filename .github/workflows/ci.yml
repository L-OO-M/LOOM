name: CI

# Mirrors the mandatory pre-commit gates in AGENTS.md §5. They were previously
# manual-only: nothing in the repo ran them on push, so a regression could merge
# and sit undetected until the next human session.
#
# E2E is intentionally not run here: it needs real Supabase/Auth0 env vars and a
# seeded database, which this workflow does not have. Run it locally per AGENTS.md
# §5 before pushing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # Read-only: the scanner only needs the checked-out files. No GITHUB_TOKEN,
    # no write scopes, no org licence secret required (see note below).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # gitleaks/gitleaks-action v2 is EOL on GitHub-hosted runners (Node 20 is
      # removed in Sept 2026) and needs a paid/free org licence key. Use the
      # official pinned gitleaks image instead: same engine, no licence, no
      # third-party action surface. `--redact` keeps secret values out of logs;
      # findings still name the rule, file, and line.
      - name: Run gitleaks
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          dir /repo --redact --verbose --no-banner --exit-code 1

  lint:
    name: Lint + encoding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 2 pre-existing warnings are the ceiling; -max-warnings=0 on errors only
      # means this fails on NEW errors, which is what the gate is for.
      - run: npm run lint
      # Mojibake gate. Editors have been saving files with a UTF-8 BOM that a
      # later tool read as cp1252, which surfaced as garbage text in rendered
      # pages. This fails the build rather than auto-fixing: silent rewriting
      # makes a wrong fix permanent, and a check that fails on correct text gets
      # switched off, at which point it catches nothing.
      - run: npm run check:encoding

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  migrations:
    name: Migrations (apply twice)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loom_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loom_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The base schema revokes from Supabase's roles, so they must exist even
      # on a plain Postgres service container.
      - name: Create Supabase-compatible roles
        run: |
          node -e "const p=require('postgres');const s=p(process.env.DATABASE_URL,{max:1});(async()=>{await s\`CREATE ROLE anon NOLOGIN\`;await s\`CREATE ROLE authenticated NOLOGIN\`;await s.end()})()"
      - name: Apply migrations
        run: node load/migrate.js | tee /tmp/first.log
      - name: Apply migrations again
        run: |
          node load/migrate.js | tee /tmp/second.log
          grep -q "0 applied" /tmp/second.log