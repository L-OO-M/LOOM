# Extends the default gitleaks rules; nothing is disabled.
#
# The only additions are exact allowlists for values that are deliberately
# fake and are asserted on by tests/env-secrets.test.js. They are matched by
# full value, not by path, so a real credential committed anywhere (including
# inside tests/) is still reported.
title = "LOOM gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Fake fixtures from tests/env-secrets.test.js"
regexTarget = "secret"
regexes = [
  '''(?i)^a-real-long-(webhook|credential)-secret(-value)?$''',
  '''(?i)^explicit-credential-secret-value$''',
  '''(?i)^fixture-client-secret-not-real-0+$''',
  # The fake client id shared by tests/env-secrets.test.js and
  # tests/deploy-env-check.test.js. It trips the generic-api-key rule on entropy
  # alone: it is a well-formed-looking id in a tracked test file, which is exactly
  # what the surrounding comments forbid (they must never be live credentials).
  '''^0123456789abcdefTESTfixture$''',
  '''^0{40}$''',
  # Google Search Console ownership token. This value is public by construction:
  # it is both the meta-tag content and the name of the file Google fetches
  # (/googleqSi...html). Gitleaks flags it as a generic API key because of its
  # entropy, not because it grants any access. Kept as an exact value so a real
  # Google credential committed anywhere is still reported.
  '''^qSiVffVox-zKvotGZAva73O1SMfVMxaf_qiCl24FIZc$''',
  # Fake ownership-code fixture asserted on in tests/identity.test.js. The
  # production format is `loom-verify-<12 hex>`; it is intentionally published
  # in the member's page so a reviewer can confirm control, which is why only
  # this exact fixture value is allowlisted rather than the whole format.
  '''^loom-verify-abc123456789$''',
]
